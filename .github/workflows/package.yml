name: Package extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install packaging dependency
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { version } = JSON.parse(readFileSync("manifest.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${version}`) {
              throw new Error("Release tag must match the manifest version");
            }
          '
      - name: Package extension
        run: npm run package
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v7
        with:
          path: dist/pixiv-multi-account-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/pixiv-multi-account-*.zip --clobber
          else
            gh release create "$RELEASE_TAG" dist/pixiv-multi-account-*.zip \
              --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
